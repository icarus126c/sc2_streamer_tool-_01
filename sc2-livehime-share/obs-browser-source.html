<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }

      img {
        width: 100vw;
        height: 100vh;
        display: block;
        object-fit: contain;
      }
    </style>
  </head>
  <body>
    <img id="overlay" src="./overlay-competitive.svg" alt="" />
    <script>
      const params = new URLSearchParams(window.location.search);
      if (params.get("mode") === "show") {
        document.getElementById("overlay").src = "./overlay-show.svg";
      }
    </script>
  </body>
</html>
